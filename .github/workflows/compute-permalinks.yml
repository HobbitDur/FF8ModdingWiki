name: Compute Permalinks

on:
  push:
    branches: ["main"]

# The job pushes its commit back to main.
permissions:
  contents: write

# One run at a time, so two quick pushes never race to push their permalink commits.
concurrency:
  group: compute-permalinks
  cancel-in-progress: false

jobs:
  compute-permalinks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Any current Python 3; the script only uses the standard library.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate permalinks
        run: python .github/scripts/generate_permalinks.py

      # Commit only the pages, and rebase on anything pushed while this ran.
      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add FF8
          if git diff --staged --quiet; then
            echo "No permalink to add."
            exit 0
          fi
          git commit -m "Automatically generate permalinks"
          git pull --rebase origin main
          git push origin HEAD:main
